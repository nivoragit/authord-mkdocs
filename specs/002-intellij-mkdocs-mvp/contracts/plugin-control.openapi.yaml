openapi: 3.1.0
info:
  title: IntelliJ MkDocs Plugin Control Contract
  version: 0.1.0
  description: >
    Internal control contract for MVP runtime lifecycle, topic-tree commands,
    and preview navigation coordination.
x-contract-validation:
  validatedOn: "2026-02-08"
  validatedAgainst:
    - "modules/ui-plugin/src/main/kotlin/com/authord/mkdocs/ui/PluginActivationService.kt"
    - "modules/extension-ports/src/main/kotlin/com/authord/mkdocs/ports/topic/TopicTreeCommandDtos.kt"
    - "modules/extension-ports/src/main/kotlin/com/authord/mkdocs/ports/command/DefaultPluginCommandBus.kt"
    - "modules/core-domain/src/main/kotlin/com/authord/mkdocs/core/navigation/RouteMappingService.kt"
  notes:
    - "Runtime start/stop/restart/status schemas align with runtime manager lifecycle states."
    - "Topic tree command/result DTO fields align with implemented command classes."
    - "Preview navigation request/result aligns with navigation coordinator route mapping behavior."
servers:
  - url: plugin://local
    description: In-process plugin command boundary
paths:
  /v1/runtime/start:
    post:
      summary: Start runtime and mkdocs server for a project
      operationId: startRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeStartRequest'
      responses:
        '202':
          description: Startup accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
  /v1/runtime/stop:
    post:
      summary: Stop active mkdocs server
      operationId: stopRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeStopRequest'
      responses:
        '200':
          description: Stop completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
  /v1/runtime/restart:
    post:
      summary: Restart active mkdocs server
      operationId: restartRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRestartRequest'
      responses:
        '202':
          description: Restart accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
  /v1/runtime/status/{projectId}:
    get:
      summary: Get runtime status for project
      operationId: getRuntimeStatus
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current runtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
  /v1/topic-tree/commands:
    post:
      summary: Execute topic-tree mutation command
      operationId: executeTopicTreeCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicTreeCommand'
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicTreeCommandResult'
  /v1/preview/navigation:
    post:
      summary: Navigate preview to mapped route from selected docs file
      operationId: navigatePreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewNavigationRequest'
      responses:
        '200':
          description: Navigation handled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewNavigationResult'
components:
  schemas:
    RuntimeStartRequest:
      type: object
      required: [projectId, projectPath]
      properties:
        projectId:
          type: string
        projectPath:
          type: string
        ensureRuntime:
          type: boolean
          default: true
    RuntimeStopRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
    RuntimeRestartRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
    RuntimeStatus:
      type: object
      required: [projectId, state, singleInstance]
      properties:
        projectId:
          type: string
        state:
          type: string
          enum:
            - UNINITIALIZED
            - BOOTSTRAPPING
            - READY
            - SERVING
            - RESTARTING
            - STOPPING
            - STOPPED
            - FAILED
            - DISPOSED
        baseUrl:
          type: string
          format: uri
        runtimeReady:
          type: boolean
        singleInstance:
          type: boolean
        lastError:
          type: string
    TopicTreeCommand:
      type: object
      required: [commandId, commandType, treeId, payload]
      properties:
        commandId:
          type: string
        commandType:
          type: string
          enum: [ADD, MOVE, REMOVE, REORDER, VALIDATE]
        treeId:
          type: string
        payload:
          oneOf:
            - $ref: '#/components/schemas/AddNodePayload'
            - $ref: '#/components/schemas/MoveNodePayload'
            - $ref: '#/components/schemas/RemoveNodePayload'
            - $ref: '#/components/schemas/ReorderNodePayload'
            - $ref: '#/components/schemas/ValidateTreePayload'
    AddNodePayload:
      type: object
      required: [parentNodeId, nodeId, title, orderIndex]
      properties:
        parentNodeId:
          type: string
        nodeId:
          type: string
        title:
          type: string
          minLength: 1
        orderIndex:
          type: integer
          minimum: 0
    MoveNodePayload:
      type: object
      required: [nodeId, newParentNodeId, newOrderIndex]
      properties:
        nodeId:
          type: string
        newParentNodeId:
          type: string
        newOrderIndex:
          type: integer
          minimum: 0
    RemoveNodePayload:
      type: object
      required: [nodeId]
      properties:
        nodeId:
          type: string
    ReorderNodePayload:
      type: object
      required: [parentNodeId, orderedNodeIds]
      properties:
        parentNodeId:
          type: string
        orderedNodeIds:
          type: array
          items:
            type: string
          minItems: 1
    ValidateTreePayload:
      type: object
      properties:
        strict:
          type: boolean
          default: true
    TopicTreeCommandResult:
      type: object
      required: [commandId, status]
      properties:
        commandId:
          type: string
        status:
          type: string
          enum: [SUCCESS, REJECTED, FAILED]
        treeVersion:
          type: integer
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
        message:
          type: string
    Violation:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
        detail:
          type: string
    PreviewNavigationRequest:
      type: object
      required: [projectId, selectedPath]
      properties:
        projectId:
          type: string
        selectedPath:
          type: string
        docsRoot:
          type: string
          default: docs
    PreviewNavigationResult:
      type: object
      required: [projectId, outcome]
      properties:
        projectId:
          type: string
        mappedRoute:
          type: string
        outcome:
          type: string
          enum: [APPLIED, SKIPPED, FAILED]
        reason:
          type: string

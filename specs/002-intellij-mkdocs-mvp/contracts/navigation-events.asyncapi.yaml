asyncapi: 3.0.0
info:
  title: IntelliJ MkDocs Plugin Shell Events
  version: 0.2.0
  description: Event contracts for plugin-shell readiness, tool-window initialization, action invocations, and runtime handoff outcomes.
channels:
  plugin.shell.loaded:
    address: plugin.shell.loaded
    messages:
      shellLoaded:
        $ref: '#/components/messages/PluginShellLoaded'
  plugin.shell.tool-window.ready:
    address: plugin.shell.tool-window.ready
    messages:
      toolWindowReady:
        $ref: '#/components/messages/ToolWindowReady'
  plugin.shell.action.updated:
    address: plugin.shell.action.updated
    messages:
      actionUpdated:
        $ref: '#/components/messages/StartActionUpdated'
  plugin.shell.action.invoked:
    address: plugin.shell.action.invoked
    messages:
      actionInvoked:
        $ref: '#/components/messages/StartActionInvoked'
  plugin.shell.runtime.handoff.succeeded:
    address: plugin.shell.runtime.handoff.succeeded
    messages:
      handoffSucceeded:
        $ref: '#/components/messages/RuntimeHandoffSucceeded'
  plugin.shell.runtime.handoff.failed:
    address: plugin.shell.runtime.handoff.failed
    messages:
      handoffFailed:
        $ref: '#/components/messages/RuntimeHandoffFailed'
operations:
  publishPluginShellLoaded:
    action: send
    channel:
      $ref: '#/channels/plugin.shell.loaded'
    messages:
      - $ref: '#/channels/plugin.shell.loaded/messages/shellLoaded'
  publishToolWindowReady:
    action: send
    channel:
      $ref: '#/channels/plugin.shell.tool-window.ready'
    messages:
      - $ref: '#/channels/plugin.shell.tool-window.ready/messages/toolWindowReady'
  publishStartActionUpdated:
    action: send
    channel:
      $ref: '#/channels/plugin.shell.action.updated'
    messages:
      - $ref: '#/channels/plugin.shell.action.updated/messages/actionUpdated'
  publishStartActionInvoked:
    action: send
    channel:
      $ref: '#/channels/plugin.shell.action.invoked'
    messages:
      - $ref: '#/channels/plugin.shell.action.invoked/messages/actionInvoked'
  publishRuntimeHandoffSucceeded:
    action: send
    channel:
      $ref: '#/channels/plugin.shell.runtime.handoff.succeeded'
    messages:
      - $ref: '#/channels/plugin.shell.runtime.handoff.succeeded/messages/handoffSucceeded'
  publishRuntimeHandoffFailed:
    action: send
    channel:
      $ref: '#/channels/plugin.shell.runtime.handoff.failed'
    messages:
      - $ref: '#/channels/plugin.shell.runtime.handoff.failed/messages/handoffFailed'
components:
  messages:
    PluginShellLoaded:
      name: PluginShellLoaded
      payload:
        $ref: '#/components/schemas/PluginShellLoadedPayload'
    ToolWindowReady:
      name: ToolWindowReady
      payload:
        $ref: '#/components/schemas/ToolWindowReadyPayload'
    StartActionUpdated:
      name: StartActionUpdated
      payload:
        $ref: '#/components/schemas/StartActionUpdatedPayload'
    StartActionInvoked:
      name: StartActionInvoked
      payload:
        $ref: '#/components/schemas/StartActionInvokedPayload'
    RuntimeHandoffSucceeded:
      name: RuntimeHandoffSucceeded
      payload:
        $ref: '#/components/schemas/RuntimeHandoffSucceededPayload'
    RuntimeHandoffFailed:
      name: RuntimeHandoffFailed
      payload:
        $ref: '#/components/schemas/RuntimeHandoffFailedPayload'
  schemas:
    PluginShellLoadedPayload:
      type: object
      required: [eventId, projectId, pluginLoaded, occurredAt]
      properties:
        eventId:
          type: string
        projectId:
          type: string
        pluginLoaded:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    ToolWindowReadyPayload:
      type: object
      required: [eventId, projectId, toolWindowId, contentCreated, occurredAt]
      properties:
        eventId:
          type: string
        projectId:
          type: string
        toolWindowId:
          type: string
        contentCreated:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    StartActionUpdatedPayload:
      type: object
      required: [eventId, projectId, visible, enabled, occurredAt]
      properties:
        eventId:
          type: string
        projectId:
          type: string
        visible:
          type: boolean
        enabled:
          type: boolean
        disabledReason:
          type: string
        occurredAt:
          type: string
          format: date-time
    StartActionInvokedPayload:
      type: object
      required: [eventId, projectId, triggerSource, occurredAt]
      properties:
        eventId:
          type: string
        projectId:
          type: string
        triggerSource:
          type: string
          enum: [ACTION, TOOL_WINDOW]
        occurredAt:
          type: string
          format: date-time
    RuntimeHandoffSucceededPayload:
      type: object
      required: [eventId, projectId, started, alreadyRunning, previewUrl, occurredAt]
      properties:
        eventId:
          type: string
        projectId:
          type: string
        started:
          type: boolean
        alreadyRunning:
          type: boolean
        previewUrl:
          type: string
          format: uri
        occurredAt:
          type: string
          format: date-time
    RuntimeHandoffFailedPayload:
      type: object
      required: [eventId, projectId, failureReason, occurredAt]
      properties:
        eventId:
          type: string
        projectId:
          type: string
        failureReason:
          type: string
        occurredAt:
          type: string
          format: date-time

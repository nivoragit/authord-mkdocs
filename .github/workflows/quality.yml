name: Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  scoped-coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enforce scoped 100% coverage gate
        run: ./gradlew clean scopedCoverageGate --no-daemon
